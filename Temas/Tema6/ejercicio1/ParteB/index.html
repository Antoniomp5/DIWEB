<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi centro educativo</title>
    <style>
        h1{
            color: blue;
            font-size: 32px;
        }

        h2:first-of-type{
            color: green;
        }

        p:last-of-type{
            text-align: center;
        }

        p{
            font-size: 18px;
        }

        h2{
            color: orange;
        }
        
    </style>
</head>
<body>

    <h1>IES Los Remedios</h1>

    <h2>Oferta educativa</h2>

    <p>En nuestro centro impartimos diferentes
       ciclos formativos.</p>

    <h2>Ciclos formativos</h2>

    <ul>
        <li>Desarrollo de Aplicaciones Web</li>
        <li>Administración de Sistemas Informáticos</li>
    </ul>

    <p>Consulta nuestra oferta educativa.</p>

</body>
</html>

<!-- ¿Qué diferencias encuentras entre las dos soluciones? -->
 <!-- La diferencia erradica en que en la parte B, tenemos todo metido en un código CSS
  y en la teiqueta <style>, permitiendo una edición más global. En la parte A, está incrutrado dentro de la  
    etiqueta con la referncia style="", con eso tenemos un ajuste más personalizado-->

<!-- ¿Qué sucede si queremos aplicar el mismo estilo a diez páginas? -->
 <!-- Para eso, haríamos el CSS en un fichero difrente y lo refernciamos con un href="", ya que sería más
  comodo a la hora de editar los estilos de la página  -->

<!-- ¿Qué modalidad utilizarías en un proyecto real? -->
 <!-- En un proyecto real, usaria por capas. Es decir, refernciado. Siendo más comodo
  a la hora de realizar la página web-->
